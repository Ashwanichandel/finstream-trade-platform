# =====================================================
# Application
# =====================================================
spring.application.name=settlement-service
server.port=8083

# =====================================================
# H2 Database (In-Memory)
# =====================================================
spring.datasource.url=jdbc:h2:mem:fin360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# Kafka Bootstrap
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092

# =====================================================
# Kafka Producer Configuration
# =====================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# =====================================================
# Kafka Consumer Configuration
# =====================================================
spring.kafka.consumer.group-id=settlement-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.finstream.settlement.dto,com.finstream.settlement.entity
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

# =====================================================
# Kafka Topics (Centralized)
# =====================================================
kafka.topic.trade-validated=trade.validated
kafka.topic.settlement-events=settlement.events
kafka.topic.settlement-retry=settlement.retry

# =====================================================
# Settlement Retry Configuration
# =====================================================
settlement.retry.max-attempts=3
settlement.retry.backoff-ms=5000

# =====================================================
# Jackson Time Configuration
# =====================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# =====================================================
# Logging (FinTech Production Style)
# =====================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.finstream=DEBUG
logging.level.org.apache.kafka=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
